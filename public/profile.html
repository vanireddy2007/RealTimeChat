
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - RealTimeChat</title>
    <link rel="stylesheet" href="style.css">

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0f2f5;
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 20px;
            box-sizing: border-box;
        }

        .profile-card {
            width: 100%;
            max-width: 420px;
            box-sizing: border-box;
            background: white;
            padding: 28px;
            border-radius: 16px;
            box-shadow: 0 5px 20px #00000012;
        }

        .profile-card h1 {
            text-align: center;
        }

        #avatar {
            display: block;
            width: 110px;
            height: 110px;
            border-radius: 50%;
            object-fit: cover;
            margin: 20px auto;
            background: #eee;
        }

        label {
            display: block;
            margin: 15px 0 6px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 7px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 18px;
            border: 0;
            border-radius: 7px;
            background: #008f72;
            color: white;
            cursor: pointer;
        }

        #status {
            overflow-wrap: anywhere;
            text-align: center;
        }

        a {
            display: block;
            text-align: center;
            margin-top: 18px;
            color: #008f72;
        }
    </style>
</head>

<body>
<div class="profile-card">
    <h1>My Profile</h1>

    <img id="avatar"
         src="https://placehold.co/110x110?text=User"
         alt="Profile picture">

    <form id="profileForm">
        <label for="name">Full name</label>
        <input id="name" maxlength="100" required>

        <label for="username">Username</label>
        <input id="username" readonly>

        <label for="email">Email</label>
        <input id="email" type="email" readonly>

        <label for="picture">Profile picture URL</label>
        <input id="picture" type="url" maxlength="500"
               placeholder="https://example.com/photo.jpg">

        <button type="submit">Save Profile</button>
    </form>

    <p id="status" role="status"></p>
    <a href="/chat.html">Back to Chat</a>
</div>

<script>
const token = localStorage.getItem("token");

const form = document.getElementById("profileForm");
const statusText = document.getElementById("status");
const avatar = document.getElementById("avatar");
const pictureInput = document.getElementById("picture");

if (!token) {
    window.location.href = "/index.html";
} else {
    loadProfile();
}

async function loadProfile() {
    try {
        const response = await fetch("/api/users/profile", {
            headers: {
                Authorization: `Bearer ${token}`
            }
        });

        const data = await response.json();

        if (!response.ok) {
            throw new Error(data.message || "Could not load profile");
        }

        document.getElementById("name").value = data.name || "";
        document.getElementById("username").value = data.username || "";
        document.getElementById("email").value = data.email || "";
        pictureInput.value = data.profile_picture || "";

        if (data.profile_picture) {
            avatar.src = data.profile_picture;
        }
    } catch (error) {
        statusText.textContent = error.message;
    }
}

pictureInput.addEventListener("input", () => {
    const value = pictureInput.value.trim();

    try {
        const url = new URL(value);

        if (url.protocol === "https:" || url.protocol === "http:") {
            avatar.src = url.href;
        }
    } catch {
        // Wait until a complete URL is entered.
    }
});

avatar.addEventListener("error", () => {
    avatar.src = "https://placehold.co/110x110?text=User";
});

form.addEventListener("submit", async event => {
    event.preventDefault();

    const name = document.getElementById("name").value.trim();
    const picture = pictureInput.value.trim();

    if (!name) {
        statusText.textContent = "Please enter your name.";
        return;
    }

    if (picture && !/^https?:\/\/\S+$/i.test(picture)) {
        statusText.textContent = "Enter a valid image URL.";
        return;
    }

    try {
        statusText.textContent = "Saving...";

        const response = await fetch("/api/users/profile", {
            method: "PUT",
            headers: {
                "Content-Type": "application/json",
                Authorization: `Bearer ${token}`
            },
            body: JSON.stringify({
                name,
                profile_picture: picture || null
            })
        });

        const data = await response.json();

        if (!response.ok) {
            throw new Error(data.message || "Could not update profile");
        }

        statusText.textContent = data.message || "Profile updated.";

        if (data.profile) {
            document.getElementById("name").value = data.profile.name || "";
            pictureInput.value = data.profile.profile_picture || "";
            avatar.src = data.profile.profile_picture ||
                "https://placehold.co/110x110?text=User";

            const user = JSON.parse(localStorage.getItem("user") || "{}");
            user.name = data.profile.name;
            user.profile_picture = data.profile.profile_picture;
            localStorage.setItem("user", JSON.stringify(user));
        }
    } catch (error) {
        statusText.textContent = error.message;
    }
});
</script>
</body>
</html>
