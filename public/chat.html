
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RealTimeChat</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="chat-container">

    <div class="sidebar">
        <div class="sidebar-header">
            <div>
                <h2>Chats</h2>
                <p id="myName"></p>
            </div>
            <button id="logoutBtn" type="button">Logout</button>
        </div>

        <div class="search-box">
            <input id="searchInput" type="text"
                   placeholder="Search users..." autocomplete="off">
        </div>

        <div id="usersList" class="users-list">
            <p class="loading">Loading users...</p>
        </div>
    </div>

    <div class="chat-area">
        <div id="chatHeader" class="chat-header">
            <div>
                <h3 id="chatUserName">Select a user</h3>
                <span id="onlineStatus"></span>
            </div>

            <button id="profileButton" type="button">My Profile</button>
        </div>

        <div id="messagesContainer" class="messages-container">
            <div class="welcome-message">
                <h2>Welcome to RealTimeChat</h2>
                <p>Select a user to start chatting.</p>
            </div>
        </div>

        <div id="typingIndicator" class="typing-indicator"></div>

        <div class="message-input-area">
            <input id="messageInput" type="text"
                   placeholder="Type a message..." autocomplete="off">
            <button id="sendBtn" type="button">Send</button>
        </div>
    </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="chat.js"></script>
</body>
</html>
