<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - RealTimeChat</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0f2f5;

            display: flex;
            justify-content: center;
            align-items: center;

            min-height: 100vh;
            margin: 0;
        }

        .login-box {
            background: white;
            width: 350px;
            padding: 30px;

            border-radius: 12px;

            box-shadow:
                0 4px 15px rgba(0, 0, 0, 0.15);
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            box-sizing: border-box;

            padding: 12px;
            margin-bottom: 15px;

            border: 1px solid #ccc;
            border-radius: 6px;

            font-size: 15px;
        }

        button {
            width: 100%;

            padding: 12px;

            border: none;
            border-radius: 6px;

            background: #128c7e;
            color: white;

            font-size: 16px;

            cursor: pointer;
        }

        button:hover {
            background: #075e54;
        }

        #message {
            text-align: center;
            margin-top: 15px;
        }

        .register-link {
            text-align: center;
            margin-top: 15px;
        }
    </style>
</head>

<body>

    <div class="login-box">

        <h1>RealTimeChat</h1>

        <form id="loginForm">

            <input
                type="text"
                id="username"
                placeholder="Username or Email"
                required
            >

            <input
                type="password"
                id="password"
                placeholder="Password"
                required
            >

            <button type="submit">
                Login
            </button>

        </form>

        <p id="message"></p>

        <div class="register-link">
            Don't have an account?
            <a href="register.html">Create Account</a>
        </div>

    </div>


    <script>

        document
            .getElementById("loginForm")
            .addEventListener("submit", async function(event) {

                event.preventDefault();

                const username =
                    document.getElementById("username").value;

                const password =
                    document.getElementById("password").value;

                const message =
                    document.getElementById("message");

                try {

                    const response = await fetch(
                        "/api/auth/login",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type": "application/json"
                            },

                            body: JSON.stringify({
                                username,
                                password
                            })
                        }
                    );

                    const data = await response.json();

                    if (response.ok) {

                        localStorage.setItem(
                            "token",
                            data.token
                        );

                        localStorage.setItem(
                            "user",
                            JSON.stringify(data.user)
                        );

                        message.style.color = "green";
                        message.textContent =
                            "Login successful!";

                        setTimeout(() => {
                            window.location.href =
                                "chat.html";
                        }, 500);

                    } else {

                        message.style.color = "red";

                        message.textContent =
                            data.message;
                    }

                } catch (error) {

                    message.style.color = "red";

                    message.textContent =
                        "Could not connect to server";
                }

            });

    </script>

</body>
</html>
